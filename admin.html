<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROCK ESPORTS — Owner Control</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050912;color:#eef5ff;font-family:Arial,sans-serif}.wrap{max-width:1150px;margin:auto;padding:20px}.bar{position:sticky;top:0;z-index:10;background:#08111d;border-bottom:1px solid #20364e;padding:14px 0;display:flex;justify-content:space-between;align-items:center}.panel{background:#0b1421;border:1px solid #21384f;border-radius:16px;padding:20px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.item{border:1px solid #21384f;border-radius:13px;padding:14px}.item img{width:110px;height:110px;object-fit:cover;border-radius:12px;display:block;margin:8px 0}.btn{background:#159eea;color:#fff;border:0;border-radius:9px;padding:11px 15px;font-weight:900;cursor:pointer}.red{background:#9a3333}.green{background:#16815a}input,textarea,select{width:100%;padding:11px;margin:5px 0 12px;background:#07101b;color:#fff;border:1px solid #2a4862;border-radius:8px}textarea{min-height:90px}.muted{color:#92a7bd;line-height:1.6}.hide{display:none}.tabs button{margin:4px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="bar"><b>ROCK <span style="color:#31b7ff">ESPORTS</span> — OWNER CONTROL</b><a href="index.html"><button class="btn">View Website</button></a></div>
<div id="login" class="panel"><h2>Owner Login</h2><p class="muted">This login uses Supabase Auth. Only the authorized owner account can open the editor.</p><input id="email" type="email" placeholder="Owner email"><input id="password" type="password" placeholder="Password"><button class="btn" onclick="login()">LOGIN</button><p id="msg"></p></div>
<div id="app" class="hide">
<div class="panel"><h2>Home / About / Social</h2><label>Hero title</label><input id="hero_title"><label>Hero text</label><textarea id="hero_text"></textarea><label>About title</label><input id="about_title"><label>About text</label><textarea id="about_text"></textarea><label>Official email</label><input id="site_email"><label>Social links/text</label><input id="site_social"><button class="btn green" onclick="saveSettings()">SAVE WEBSITE</button></div>
<div class="panel"><h2>Management — 8 people</h2><p class="muted">Each slot supports name, position, bio and photo upload.</p><div id="management" class="grid"></div><button class="btn green" onclick="saveManagement()">SAVE MANAGEMENT</button></div>
<div class="panel"><h2>Members — 16 people</h2><div id="members" class="grid"></div><button class="btn green" onclick="saveMembers()">SAVE MEMBERS</button></div>
<div class="panel"><h2>News</h2><div id="news"></div><button class="btn" onclick="addNews()">ADD NEWS</button></div>
<div class="panel"><h2>Tournaments</h2><div id="tournaments"></div><button class="btn" onclick="addTournament()">ADD TOURNAMENT</button></div>
<div class="panel"><button class="btn red" onclick="logout()">LOG OUT</button><p id="saved" class="muted"></p></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
let sb=null, state={};
if(window.ROCK_CONFIG?.SUPABASE_URL?.startsWith("http")&&!window.ROCK_CONFIG.SUPABASE_URL.includes("YOUR-")){sb=supabase.createClient(ROCK_CONFIG.SUPABASE_URL,ROCK_CONFIG.SUPABASE_ANON_KEY);window.rockSupabase=sb}
async function login(){if(!sb){msg.textContent="First configure config.js with Supabase URL and publishable anon key.";return}const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.textContent=error.message;return}await start()}
async function start(){document.getElementById("login").classList.add("hide");document.getElementById("app").classList.remove("hide");await loadAll()}
async function loadAll(){const s=await sb.from("site_settings").select("*").eq("id",1).single();const m=await sb.from("management").select("*").order("slot");const p=await sb.from("members").select("*").order("slot");const n=await sb.from("news").select("*").order("created_at",{ascending:false});const t=await sb.from("tournaments").select("*").order("created_at",{ascending:false});state={settings:s.data||{},management:m.data||[],members:p.data||[],news:n.data||[],tournaments:t.data||[]};render()}
function render(){hero_title.value=state.settings.hero_title||"ROCK ESPORTS";hero_text.value=state.settings.hero_text||"";about_title.value=state.settings.about_title||"About ROCK ESPORTS";about_text.value=state.settings.about_text||"";site_email.value=state.settings.email||"";site_social.value=state.settings.social||"";document.getElementById("management").innerHTML=state.management.map(personCard("management")).join("");document.getElementById("members").innerHTML=state.members.map(personCard("members")).join("");document.getElementById("news").innerHTML=state.news.map((x,i)=>`<div class="item"><input id="nt${i}" value="${attr(x.title)}" placeholder="Title"><textarea id="nb${i}">${x.body||""}</textarea><input id="ni${i}" value="${attr(x.image_url||"")}" placeholder="Image URL (or upload later)"><label><input id="np${i}" type="checkbox" ${x.published?"checked":""}> Published</label> <button class="btn red" onclick="deleteNews('${x.id}')">DELETE</button><button class="btn green" onclick="saveNews('${x.id}',${i})">SAVE</button></div>`).join("");document.getElementById("tournaments").innerHTML=state.tournaments.map((x,i)=>`<div class="item"><input id="tt${i}" value="${attr(x.title)}" placeholder="Tournament title"><input id="ts${i}" value="${attr(x.status||"UPCOMING")}" placeholder="Status"><textarea id="tb${i}">${x.body||""}</textarea><input id="ti${i}" value="${attr(x.image_url||"")}" placeholder="Image URL"><button class="btn red" onclick="deleteTournament('${x.id}')">DELETE</button><button class="btn green" onclick="saveTournament('${x.id}',${i})">SAVE</button></div>`).join("")}
function personCard(type){return (x,i)=>`<div class="item"><b>${i+1}. ${type==="management"?"Management":"Member"}</b><input id="${type}name${i}" value="${attr(x.name)}" placeholder="Name"><input id="${type}role${i}" value="${attr(x.position||x.role||"")}" placeholder="Position / Role"><textarea id="${type}bio${i}" placeholder="Bio">${x.bio||""}</textarea><img id="${type}img${i}" src="${x.photo_url||""}" ${x.photo_url?"":"style='display:none'"}><input type="file" accept="image/*" onchange="uploadPhoto(this,'${type}',${i})"><input id="${type}url${i}" value="${attr(x.photo_url||"")}" placeholder="Photo URL"><button class="btn green" onclick="savePerson('${type}',${i})">SAVE</button></div>`}
async function uploadPhoto(inp,type,i){const f=inp.files[0];if(!f)return;if(!sb){alert("Configure Supabase first");return}const path=`${type}/${crypto.randomUUID()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;const {error}=await sb.storage.from("site-media").upload(path,f,{upsert:false});if(error){alert(error.message);return}const {data}=sb.storage.from("site-media").getPublicUrl(path);document.getElementById(type+"url"+i).value=data.publicUrl;const im=document.getElementById(type+"img"+i);im.src=data.publicUrl;im.style.display="block"}
async function savePerson(type,i){const x=state[type][i];const payload={name:document.getElementById(type+"name"+i).value, bio:document.getElementById(type+"bio"+i).value, photo_url:document.getElementById(type+"url"+i).value};payload[type==="management"?"position":"role"]=document.getElementById(type+"role"+i).value;const {error}=await sb.from(type).update(payload).eq("id",x.id);notice(error?.message||"Saved online");await loadAll()}
async function saveManagement(){for(let i=0;i<8;i++)await savePerson("management",i);notice("Management saved online")}
async function saveMembers(){for(let i=0;i<16;i++)await savePerson("members",i);notice("Members saved online")}
async function saveSettings(){const {error}=await sb.from("site_settings").update({hero_title:hero_title.value,hero_text:hero_text.value,about_title:about_title.value,about_text:about_text.value,email:site_email.value,social:site_social.value}).eq("id",1);notice(error?.message||"Website content saved online")}
async function saveNews(id,i){const {error}=await sb.from("news").update({title:document.getElementById("nt"+i).value,body:document.getElementById("nb"+i).value,image_url:document.getElementById("ni"+i).value,published:document.getElementById("np"+i).checked}).eq("id",id);notice(error?.message||"News saved online");loadAll()}
async function deleteNews(id){if(confirm("Delete this news?")){await sb.from("news").delete().eq("id",id);loadAll()}}
async function addNews(){const {error}=await sb.from("news").insert({title:"New News",body:"Write news here.",published:false});notice(error?.message||"News added");loadAll()}
async function saveTournament(id,i){const {error}=await sb.from("tournaments").update({title:document.getElementById("tt"+i).value,status:document.getElementById("ts"+i).value,body:document.getElementById("tb"+i).value,image_url:document.getElementById("ti"+i).value}).eq("id",id);notice(error?.message||"Tournament saved online");loadAll()}
async function deleteTournament(id){if(confirm("Delete this tournament?")){await sb.from("tournaments").delete().eq("id",id);loadAll()}}
async function addTournament(){const {error}=await sb.from("tournaments").insert({title:"New Tournament",status:"UPCOMING",body:"Tournament details."});notice(error?.message||"Tournament added");loadAll()}
async function logout(){await sb.auth.signOut();location.reload()}
function notice(x){document.getElementById("saved").textContent=x;setTimeout(()=>saved.textContent="",3500)}
function attr(x){return String(x||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;")}
if(sb)sb.auth.getSession().then(({data})=>{if(data.session)start()});
</script></body></html>
